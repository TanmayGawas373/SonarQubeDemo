{% extends "base.html" %}

{% block title %}Edit Lesson — {{ module.title }}{% endblock %}

{% block content %}

<section class="page-header">
    <h1>Edit Lesson</h1>
    <p>{{ module.title }}</p>
</section>

<section class="panel">

    <form id="editLessonForm" class="stack">

        <div class="mb-3">
            <label for="title" class="form-label">
                Lesson Title
            </label>

            <input type="text" id="title" name="title" class="form-control" placeholder="Lesson title"
                value="{{ lesson.title }}" required>
        </div>


        <div class="mb-3">
            <label for="content" class="form-label">
                Lesson Content
            </label>

            <textarea id="content" name="content" class="form-control" rows="8"
                placeholder="Lesson content">{{ lesson.content or '' }}</textarea>
        </div>


        <div class="mb-3">
            <label for="order" class="form-label">
                Order
            </label>

            <input type="number" id="order" name="order" class="form-control" value="{{ lesson.order or 0 }}" min="0">
        </div>


        <div class="d-flex gap-2">

            <button type="submit" id="updateButton" class="btn btn-primary">
                <i class="bi bi-save me-1"></i>
                Update Lesson
            </button>


            <a href="{{ url_for(
                    'course.course_detail',
                    course_id=module.course_id
                ) }}" class="btn btn-secondary">
                Cancel
            </a>

            <a class="button-link" href="{{ url_for('course.course_detail', course_id=module.course_id) }}">Back to Course</a>


        </div>

    </form>

</section>


<script>

    document
        .getElementById("editLessonForm")
        .addEventListener("submit", updateLesson);


    async function updateLesson(event) {

        event.preventDefault();

        const button = document.getElementById("updateButton");

        const title = document
            .getElementById("title")
            .value
            .trim();

        const content = document
            .getElementById("content")
            .value;

        const order = document
            .getElementById("order")
            .value;


        if (!title) {
            alert("Lesson title is required.");
            return;
        }


        const payload = {
            title: title,
            content: content,
            order: Number(order) || 0
        };


        button.disabled = true;
        button.innerHTML = `
        <span
            class="spinner-border spinner-border-sm me-1"
            role="status"
        ></span>
        Updating...
    `;


        try {

            const response = await fetch(
                "{{ url_for('lesson.update_lesson',module_id = module_id,lesson_id = lesson.id)}} ",
    {
        method: "PUT",

            headers: {
            "Content-Type": "application/json"
        },

        credentials: "include",

            body: JSON.stringify(payload)
    }
        );


    const data = await response.json();


    if (!response.ok) {

        alert(
            data.error ||
            "Failed to update lesson."
        );

        return;
    }


    alert(
        data.message ||
        "Lesson updated successfully."
    );


    // Redirect back to the course/module page.
    window.location.href =
        "{{ url_for('course.course_detail',course_id = module.course_id) }}"


    } catch (error) {

        console.error(
            "Update lesson error:",
            error
        );

        alert(
            "Something went wrong while updating the lesson."
        );

    } finally {

        button.disabled = false;

        button.innerHTML = `
            <i class="bi bi-save me-1"></i>
            Update Lesson
        `;
    }
}

</script>

{% endblock %}
