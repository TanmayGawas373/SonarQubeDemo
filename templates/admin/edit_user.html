<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit User · Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-mark">LMS</span>
                <span class="brand-title">Admin Panel</span>
            </div>
            <nav class="side-nav">
                <a class="nav-link" href="{{ url_for('admin_ui.dashboard') }}">
                    <i class="bi bi-grid"></i> <span>Dashboard</span>
                </a>
                <a class="nav-link active" href="{{ url_for('admin_ui.list_users') }}">
                    <i class="bi bi-people"></i> <span>User Management</span>
                </a>
                <a class="nav-link" href="{{ url_for('admin_course.list_admin_courses') }}">
                    <i class="bi bi-journal-bookmark"></i> <span>Course Management</span>
                </a>
            </nav>
        </aside>

        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Shell -->
        <div class="main-shell">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
                        <i class="bi bi-list"></i>
                    </button>
                    <nav aria-label="breadcrumb">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item text-muted">Admin</li>
                            <li class="breadcrumb-item"><a href="{{ url_for('admin_ui.list_users') }}" class="text-muted text-decoration-none">Users</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Edit User</li>
                        </ol>
                    </nav>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">A</div>
                    <form action="{{ url_for('auth.logout') }}" method="post">
                        <button type="submit" class="btn-icon" title="Logout">
                            <i class="bi bi-box-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </header>

            <main class="page-content">
                <div class="page-header">
                    <div class="page-header-content">
                        <div>
                            <h1 class="page-title">Edit User</h1>
                            <p class="page-subtitle">Update account details for {{ user.email }}.</p>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm" style="max-width: 500px;">
                    <div class="card-header">
                        <h2 class="card-header-title">Account Details</h2>
                    </div>
                    <div class="card-body">
                        {% if error %}
                        <div class="alert alert-danger mb-3">{{ error }}</div>
                        {% endif %}

                        <form method="POST" action="{{ url_for('admin_ui.edit_user', user_id=user.id) }}" class="d-flex flex-column gap-3">
                            <div>
                                <label for="email" class="form-label text-muted small fw-semibold mb-1">Email</label>
                                <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required style="padding: 0.65rem 0.9rem;">
                            </div>

                            <div>
                                <label for="role" class="form-label text-muted small fw-semibold mb-1">Role</label>
                                <select id="role" name="role" class="form-select" required style="padding: 0.65rem 0.9rem;">
                                    <option value="student" {% if user.role=='student' %}selected{% endif %}>Student</option>
                                    <option value="instructor" {% if user.role=='instructor' %}selected{% endif %}>Instructor</option>
                                    <option value="admin" {% if user.role=='admin' %}selected{% endif %}>Admin</option>
                                </select>
                            </div>

                            <div class="d-flex gap-2 justify-content-end mt-2">
                                <a href="{{ url_for('admin_ui.list_users') }}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        });

        overlay.addEventListener('click', closeSidebar);

        window.addEventListener('resize', () => {
            if (window.innerWidth > 991.98) closeSidebar();
        });
    </script>
</body>
</html>
