{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block extra_head %}
<style>
    /* ===== Auth Page Layout ===== */
    .auth-page {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem 1rem;
        background-color: #f4f5f7;
    }

    .auth-card {
        width: 100%;
        max-width: 420px;
        padding: 2.5rem 2.25rem;
        border-radius: 14px;
        background: #ffffff;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    }

    /* ===== Header ===== */
    .auth-header {
        text-align: left;
        margin-bottom: 1.75rem;
    }

    .auth-logo {
        font-size: 1.5rem;
        color: #2563eb;
        margin-bottom: 0.75rem;
    }

    .auth-title {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.35rem;
        color: #111827;
    }

    .auth-subtitle {
        color: #6b7280;
        font-size: 0.95rem;
        margin-bottom: 0;
    }

    /* ===== Form ===== */
    .auth-form .form-group {
        margin-bottom: 1.1rem;
    }

    .form-label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #374151;
        margin-bottom: 0.4rem;
        display: inline-block;
    }

    .auth-link-small {
        font-size: 0.85rem;
        color: #2563eb;
        text-decoration: none;
    }

    .auth-link-small:hover {
        text-decoration: underline;
    }

    /* ===== Input group (icon + field) ===== */
    .auth-form .input-group {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        overflow: hidden;
    }

    .auth-form .input-group:focus-within {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .auth-form .input-group-text {
        background: #f9fafb;
        border: none;
        border-right: 1px solid #e5e7eb;
        color: #9ca3af;
        width: 42px;
        justify-content: center;
    }

    .auth-form .form-control {
        border: none;
        box-shadow: none;
        padding: 0.65rem 0.85rem;
    }

    .auth-form .form-control:focus {
        box-shadow: none;
    }

    .toggle-password {
        border: none;
        background: #f9fafb;
        border-left: 1px solid #e5e7eb;
        color: #9ca3af;
    }

    .toggle-password:hover {
        background: #f3f4f6;
        color: #374151;
    }

    /* ===== Remember me / checkbox row ===== */
    .auth-form .form-check {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0.25rem 0 1.25rem;
    }

    .auth-form .form-check-input {
        margin-top: 0;
    }

    .auth-form .form-check-label {
        font-size: 0.9rem;
        color: #374151;
    }

    /* ===== Submit button ===== */
    .auth-form .btn-primary {
        width: 100%;
        padding: 0.7rem;
        font-weight: 600;
        border-radius: 8px;
        background-color: #2563eb;
        border-color: #2563eb;
    }

    .auth-form .btn-primary:hover {
        background-color: #1d4ed8;
        border-color: #1d4ed8;
    }

    /* ===== Footer ===== */
    .auth-footer {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.9rem;
        color: #6b7280;
    }

    .auth-footer a {
        color: #2563eb;
        font-weight: 600;
        text-decoration: none;
    }

    .auth-footer a:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-card panel">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="bi bi-book"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your Learning Portal account</p>
        </div>

        <form action="{{ url_for('auth.login_jwt') }}" method="post" class="auth-form" novalidate>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com"
                        required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label mb-0">Password</label>
                </div>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="btn toggle-password" data-target="password" aria-label="Show password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg mt-2">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('.toggle-password').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var input = document.getElementById(btn.dataset.target);
            var icon = btn.querySelector('i');
            var isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('bi-eye');
            icon.classList.toggle('bi-eye-slash');
            btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });
    });
</script>
{% endblock %}
