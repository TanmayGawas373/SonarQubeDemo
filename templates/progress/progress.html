{% extends "base.html" %}

{% block title %}Progress{% endblock %}

{% block content %}

<section class="page-header">
    <h1>Course Progress</h1>
    <p>Completion: {{ progress.completion_percent }}%</p>
</section>

<section class="panel">

    <div class="progress" style="height: 30px; border-radius: 15px;">
        <div class="progress-bar" role="progressbar" style="width: {{ progress.completion_percent }}%;"
            aria-valuenow="{{ progress.completion_percent }}" aria-valuemin="0" aria-valuemax="100">
            {{ progress.completion_percent }}%
        </div>
    </div>

    <div class="mt-3">
        <a href="{{ url_for('course.course_detail', course_id=course_id) }}" class="btn btn-secondary">
            Back to Course
        </a>
    </div>

</section>

{% endblock %}
