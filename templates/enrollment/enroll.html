{% extends "base.html" %}
{% block title %}Enrollment{% endblock %}
{% block content %}
<section class="page-header">
    <h1>Enroll in Course {{ course.title }}</h1>
</section>

<section class="panel">
    <div class="stack">
        <form action="{{ url_for('enrollment.enroll_student', course_id=course.id) }}" method="post">
            <button type="submit">Enroll</button>
        </form>
        <form action="{{ url_for('enrollment.unenroll_student', course_id=course.id) }}" method="post">
            <button type="submit" class="btn-link-danger">Unenroll</button>
        </form>
    </div>
</section>
{% endblock %}
