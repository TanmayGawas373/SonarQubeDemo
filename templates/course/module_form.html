{% extends "base.html" %}

{% block title %}Add Module — {{ course.title }}{% endblock %}

{% block content %}

<div class="container py-5">

    <!-- Page Header -->
    <div class="text-center mb-4">
        <h1 class="fw-bold">Add Module</h1>
        <p class="text-muted mb-0">
            Add a new module to <strong>{{ course.title }}</strong>
        </p>
    </div>

    <!-- Module Form Card -->
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <form action="{{ url_for('module.create_module', course_id=course.id) }}" method="post">

                        <!-- Module Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold">
                                Module Title
                            </label>

                            <input type="text" id="title" name="title" class="form-control"
                                placeholder="Enter module title" required>
                        </div>

                        <!-- Order -->
                        <div class="mb-4">
                            <label for="order" class="form-label fw-semibold">
                                Module Order
                            </label>

                            <input type="number" id="order" name="order" class="form-control"
                                placeholder="Enter module order" value="0" min="0">

                            <div class="form-text">
                                Use the order to control where this module appears.
                            </div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                Create Module
                            </button>

                            <a href="{{ url_for('course.course_detail', course_id=course.id) }}"
                                class="btn btn-outline-secondary">
                                Back to Course
                            </a>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
